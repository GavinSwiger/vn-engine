# CI matrix for vn-engine (04-technical.md §14.5).
# Unit and `display` tests run on all three runners (the SDL dummy video driver needs no
# X server). `perf` and `manual` tests never run in CI.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: pytest (${{ matrix.os }}, Python 3.12)
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned, hashed dependencies
        run: python -m pip install --require-hashes -r requirements-ci.txt

      - name: Install the engine
        run: python -m pip install --no-deps -e .

      - name: Run tests
        run: python -m pytest -m "not perf and not manual"

      # AC-F02-55: 1,000 fuzz cases per CI run. The step above runs cases 0-99 (chunk 0);
      # this runs chunks 1-9, which are `slow` so the local default run stays fast.
      - name: Fuzz the script loader (cases 100-999)
        run: python -m pytest -m slow tests/script/test_fuzz.py -k one_thousand_cases

  # F42 P8: real builds. Builds the example game and F47's sample with the pinned
  # PyInstaller (requirements-build.txt), runs each exe (`--bench 1` under SDL's dummy
  # drivers), checks isolation, licences and the version resource, and runs the SEC-F42-10
  # leak scan. Only `build` tests run here; the job above skips them.
  build:
    name: real build (windows-latest, Python 3.12)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned, hashed dependencies and the build tool
        run: python -m pip install --require-hashes --only-binary=:all: -r requirements-ci.txt -r requirements-build.txt

      - name: Build, run and scan the builds
        run: python -m pytest -m build
