# F12 hostile corpus (05-security.md §5; 06-acceptance.md §0.2, AC-F12-22..24).
# One row per input. Fields:
#   id, group (A–F), gen (a generator in gen_hostile.py) plus its arguments,
#   file     committed under hostile/ (else built at run time in tmp_path),
#   outcome  ok | bad | newer | any;  reason (W50's reason word for bad),
#   dropped  W54's exact count (min_dropped: at least), scheme_changed (W55),
#   loads    "never": json.loads must not be called (the pre-scan refused it),
#   max_str_digits  sys.set_int_max_str_digits for the read; max_seconds  a time bound,
#   tier     default | slow. Default runs the smallest set covering every kind (one
#            real-bound pre-scan shape, b_dicts_over; test_prescan_bound_patched runs every
#            shape at a patched bound; one over-32 MB row, b_sparse_over); the rest is slow.
# Every row also asserts: no exception escapes, json.loads gets only str, the files in
# tmp_path/outside/ are unchanged, and nothing is created outside <game>/persistent/.
# Groups D–F (quarantine, starvation at launch, links) are added with the sync and app steps.

