# F20 hostile node-file manifest (05-security.md §5 groups A, B, E; 06-acceptance.md §0.4,
# AC-F20-42, AC-F20-45, and AC-F20-41's persist half). Beside F11's hostile/saves/manifest.toml.
# One row per input, built by gen_hostile_nodes.py at run time from an engine-written node file
# (node "scene:stall", game "f20-template"; the state is F11's P8 with the node's key in its
# flow path), so nothing goes stale when the state JSON gains a field.
#
# Tier rule (06 §0.4): in each group one row of each expected-outcome kind runs in the default
# tier, plus every row that is cheap; the full-size rows are "slow".
#
# Group A (entries at a node name). Fields: entry (folder | file_symlink | dir_symlink |
#   junction | fifo | hardlink_slot | hardlink_outside), read (read_node's status), os (any |
#   windows | posix). Every row: never listed by FlowListJob; NodeFolder.remove takes only the
#   entry (a link's target, quick-1.vnsave, and outside files keep their bytes).
# Group B (names). Fields: name ("{k}" is a real node key, "{K}" it in uppercase, "{k15}" and
#   "{k17}" 15 and 17 hex digits, "{fw}" 16 full-width digits), os. Every row: never listed or
#   removed; NodeFolder.accepts is False; read, remove, and job raise ValueError with no os call.
# Group E (the node file). Fields: gen (a generator in gen_hostile_nodes.py) plus its arguments,
#   or like (an F11 hostile save row id whose recipe is applied to the node file; its F11 "full"
#   status must equal this row's unless F11 says "any"); status (read_node's: ok | missing |
#   unreadable | damaged | newer | other_game | any = ok or damaged); game_id (the reader's
#   id, default "f20-template"; "none" for no id); size_first (over SAVE_FILE_MAX by lstat: no
#   byte read). Every row: no exception; json.loads receives only str; line 2 is never
#   base64-decoded; slot files, persistent.json, settings.json, and tmp_path/outside keep their
#   SHA-256; the reason holds no path and no "aiko". Values TOML can't hold: "@null" is null,
#   "@surrogate" is the lone surrogate U+D800.
# Group E's menu- and minigame-position rows (AC-F20-26, AC-F20-33) need restore(fresh_menu=)
# and the service: they come with F20 s4/s6. Groups C, D, F, G, H are tables in
# tests/app/test_flow_service.py (s6); group J (headless ids) in tests/runtime (s4).

