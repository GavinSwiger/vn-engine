# F31 meta file names (06 §5; AC-F31-01, AC-F31-09; 05 abuse group A).
# name:      the name (an integer row is a non-str value)
# accepted:  whether is_meta_name / MetaFolder / the writer's meta client accept it
# e310_form: the E310 form a `file` line with this name gives (step 2; "" when accepted or
#            when no .vns string can hold it); name_problem's order is slash, capitals,
#            ending, reserved, long, chars
# in_vns:    whether a .vns string can hold it (F02 escapes: \n, \", \\ only; no raw controls)

[[row]]
name = "../x.chr"
accepted = false
e310_form = "slash"
in_vns = true

