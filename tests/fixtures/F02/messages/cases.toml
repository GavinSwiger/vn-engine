setup = "no script folder"
where = "game"
expect = { exact = "No story found: script/main.vns doesn't exist." }

[[case]]
id = "06-W01-empty"
ac = "AC-F02-06"
code = "W01"
needs = "load"
edit = { template = false }
where = "game"
expect = { exact = "No story found: script/main.vns doesn't exist." }

[[case]]
id = "06-W01-notes"
ac = "AC-F02-06"
