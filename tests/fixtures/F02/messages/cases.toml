# F02 message cases (06-acceptance.md §5.2): one entry per row of the message tables of
# AC-F02-03, 06, 08, 10–12, 17, 19, 20, 22–29, 32, 34, and 47 (plus AC-07's W02 rows for the
# code-point order of W02). Drives tests/script/test_messages.py and the AC-F02-50 golden
# file expected.txt (regenerate only with the reviewed command
# `.venv/Scripts/python -m tests.script.message_cases --write`).
#
# Fields of each [[case]]:
#   id      unique; with `each`, "-1", "-2", … is appended per item
#   ac      the AC the row comes from
#   code    the expected code ("-" = loads with no error and no warning)
#   needs   "parse": the single-file parse reproduces the row (runs now);
#           "load": needs load_story and the whole-game checks (checklist steps 6, 7)
#   edit    how main.vns (template T, 06 §0.4) is changed, in row notation (⏎, [n], [t],
#           {U+XXXX}, {TAB}; <<text*N>> repeats text N times):
#             S, T          the S and T rows
#             R             { "<line>" = text } replaces lines (R3, "line 5 = …")
#             text          the whole main.vns instead of T ("" = a 0-byte file)
#             gen           a named generator in message_cases.py
#             prefix_hex    bytes put before the encoded main.vns
#             F             { name = text } extra files, each also included by an
#                           `include "name"` line appended to main.vns (F rows)
#             files         { name = text | { hex = "…" } | { prefix_hex, text } | "<dir>" }
#                           files on disk that are not included ("<dir>" = a folder)
#             template      false: script/ holds only `files` (no main.vns unless listed)
#   setup   what a load test must arrange that files can't say (links, unreadable files)
#   each    variants: a list of strings (<x>) or of lists (<x>, <y>), substituted in edit
#           and expect
#   where   "5", "5:10", "script/b.vns 1", "file", "game", or "-"
#   expect  exact = message (no location prefix); or any of contains (list), starts, ends
#   also    other codes the result must have (E99 after a file problem)
#   golden  false: platform-dependent (links, modes); left out of expected.txt

# --- AC-F02-03 Include errors -----------------------------------------------------------

[[case]]
id = "03-E90"
ac = "AC-F02-03"
code = "E90"
needs = "parse"
edit = { S = 'include "chapter2.vns"' }
where = "5"
expect = { exact = '''include can't be inside a label or block, because a file belongs to the game from the start. Move it to the top level.''' }

[[case]]
id = "03-E91-case"
ac = "AC-F02-03"
code = "E91"
needs = "load"
edit = { T = 'include "chapter2.vns"', files = { "Chapter2.vns" = 'label ch2:⏎[4]return' } }
where = "9"
expect = { exact = '''can't include "chapter2.vns" because script/chapter2.vns doesn't exist. Did you mean "Chapter2.vns"?''' }
also = ["E99"]

[[case]]
id = "03-E91-close"
ac = "AC-F02-03"
code = "E91"
needs = "load"
edit = { T = 'include "chaptr2.vns"', files = { "chapter2.vns" = 'label ch2:⏎[4]return' } }
where = "9"
expect = { exact = '''can't include "chaptr2.vns" because script/chaptr2.vns doesn't exist. Did you mean "chapter2.vns"?''' }
also = ["E99"]

[[case]]
id = "03-E91-prefix"
ac = "AC-F02-03"
code = "E91"
needs = "load"
edit = { T = 'include "script/chapter2.vns"', files = { "chapter2.vns" = 'label ch2:⏎[4]return' } }
where = "9"
expect = { contains = ['''doesn't exist. Paths start inside the script folder, so write include "chapter2.vns".'''] }
also = ["E99"]

[[case]]
id = "03-E91-plain"
ac = "AC-F02-03"
code = "E91"
needs = "load"
edit = { T = 'include "nothing.vns"' }
where = "9"
expect = { starts = '''can't include "nothing.vns" because script/nothing.vns doesn't exist.''' }
also = ["E99"]

[[case]]
