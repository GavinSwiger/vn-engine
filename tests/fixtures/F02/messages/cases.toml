        ["$ x = 0b2", "5:13", 'invalid digit "2" in binary literal.'],
        ["$ print 'hi'", "5:7", 'Missing parentheses in call to "print". Did you mean print(...)?'],
        ["$ x = <<(*201>>1<<)*201>>", "5:211", "too many nested parentheses."],
        ["$ x = <<f'{*150>>1<<}'*150>>", "5:459", "too many nested f-strings."]]
