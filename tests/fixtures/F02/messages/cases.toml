edit = { T = 'include "<x>"' }
where = "9"
expect = { exact = '''can't include "<x>": paths must stay inside the script folder and use forward slashes, e.g. routes/hana.vns.''' }
also = ["E99"]

[[case]]
id = "03-E92-reason"
ac = "AC-F02-03"
code = "E92"
needs = "load"
each = [["con.vns", '"con" is a reserved file name on Windows'],
        ["a.vns.", "file and folder names can't end with a dot or a space"],
        ["<<abcdefghij/*110>>x.vns", "paths can be at most 1,024 characters long"]]
edit = { T = 'include "<x>"' }
where = "9"
expect = { starts = '''can't include "''', ends = "<y>" }
also = ["E99"]

[[case]]
id = "03-E93"
ac = "AC-F02-03"
code = "E93"
needs = "load"
edit = { T = 'include "notes.txt"' }
where = "9"
expect = { exact = '''can't include "notes.txt": only .vns files can be included.''' }
also = ["E99"]

[[case]]
id = "03-E93-upper"
ac = "AC-F02-03"
code = "E93"
needs = "load"
edit = { T = 'include "ch2.VNS"', files = { "ch2.VNS" = 'label ch2:⏎[4]return' } }
where = "9"
expect = { exact = '''can't include "ch2.VNS": only .vns files can be included. Use lower case.''' }
also = ["E99"]

[[case]]
id = "03-E94"
ac = "AC-F02-03"
code = "E94"
needs = "load"
each = ["routes", "dir.vns"]
edit = { T = 'include "<x>"', files = { "routes" = "<dir>", "dir.vns" = "<dir>" } }
where = "9"
expect = { exact = '''can't include "<x>": that is a folder. Include each .vns file in it.''' }
also = ["E99"]

[[case]]
id = "03-E95"
ac = "AC-F02-03"
code = "E95"
needs = "parse"
edit = { T = 'include chapter2.vns' }
where = "9"
expect = { exact = 'the file name goes in quotes. Write include "chapter2.vns".' }

[[case]]
id = "03-E96"
ac = "AC-F02-03"
code = "E96"
needs = "parse"
edit = { T = 'include "a.vns" "b.vns"', files = { "a.vns" = 'label a:⏎[4]return' } }
where = "9:17"
expect = { exact = 'include takes one file name, but this line has more after it. Put each file on its own line.' }

[[case]]
id = "03-E97"
ac = "AC-F02-03"
code = "E97"
needs = "load"
edit = { T = 'include "chapter2.vns"', files = { "chapter2.vns" = 'label ch2:⏎[4]return' } }
setup = "read_file raises AssetUnreadable for script/chapter2.vns"
where = "9"
expect = { exact = '''can't include "chapter2.vns" because script/chapter2.vns couldn't be read. Check that another program isn't locking it and that you have permission to read it.''' }
also = ["E99"]

[[case]]
id = "03-E05"
ac = "AC-F02-03"
code = "E05"
needs = "load"
edit = { T = 'include "huge.vns"' }
setup = "script/huge.vns is 16,777,217 bytes (comment lines)"
where = "file"
expect = { exact = 'script/huge.vns is larger than 16 MB. Split it into several files and include them.' }
also = ["E99"]

# --- AC-F02-06 Where the story begins ------------------------------------------------------

[[case]]
id = "06-W01-missing"
ac = "AC-F02-06"
code = "W01"
needs = "load"
