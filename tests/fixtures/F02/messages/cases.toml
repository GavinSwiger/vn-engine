[[case]]
id = "06-E08-close"
ac = "AC-F02-06"
code = "E08"
needs = "load"
edit = { template = false, files = { "mian.vns" = 'label start:⏎[4]return', "intro.vns" = 'label intro:⏎[4]return' } }
where = "file"
expect = { contains = ['Did you mean "mian.vns"?'] }

[[case]]
id = "06-E09"
ac = "AC-F02-06"
code = "E09"
needs = "load"
where = "file"
expect = { starts = "script/main.vns doesn't exist, but script/ has other .vns files: chapter1.vns, intro.vns, routes/a.vns, routes/b.vns, x.vns", ends = "Rename the file where your story begins to main.vns." }
[case.edit]
template = false
files = { "chapter1.vns" = "# 1", "intro.vns" = "# 2", "routes/a.vns" = "# 3", "routes/b.vns" = "# 4", "x.vns" = "# 5", "y.vns" = "# 6", "z.vns" = "# 7" }

[[case]]
id = "06-E08b"
ac = "AC-F02-06"
code = "E08b"
needs = "load"
edit = { template = false, files = { "main.vns" = 'label start:⏎[4]return' } }
setup = "read_file raises AssetUnreadable for script/main.vns"
where = "file"
expect = { exact = "script/main.vns couldn't be read. Check that another program isn't locking it and that you have permission to read it." }
also = ["E99"]

[[case]]
id = "06-E08c"
ac = "AC-F02-06"
code = "E08c"
needs = "load"
edit = { template = false, files = { "main.vns" = "<dir>" } }
where = "file"
expect = { exact = "script/main.vns is a folder. The story must begin in a file named main.vns." }
also = ["E99"]

[[case]]
id = "06-E08d-file"
ac = "AC-F02-06"
code = "E08d"
needs = "load"
golden = false
edit = { template = false }
setup = "script/main.vns is a symlink to <outside>/m.vns"
where = "file"
expect = { exact = "script/main.vns points to a place outside the game folder, which is not allowed. Keep the story files in the game's script folder." }
also = ["E99"]

[[case]]
id = "06-E08d-folder"
ac = "AC-F02-06"
code = "E08d"
needs = "load"
golden = false
edit = { template = false }
setup = "script is a symlink (Windows: junction) to <outside>/"
where = "file"
expect = { starts = "script/ points to a place outside the game folder" }
also = ["E99"]

[[case]]
id = "06-E26-empty-main"
ac = "AC-F02-06"
code = "E26"
needs = "load"
edit = { text = "" }
where = "game"
expect = { exact = 'The story has no label named "start". Add label start: to script/main.vns. The story begins there.' }

