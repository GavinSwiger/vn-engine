        ['''$ x = ('a' 'b'⏎[8]"c)''', "6:9", "a quote is never closed."],
        ['$ x = 1 \', "5:14", "the line ends before the Python is complete."],
        ['$ x = 1 \ 2', "5:14", "something follows a \\ that Python doesn't expect."],
        ["$ x = = 1", "5:11", "this isn't valid Python."],
        ["$ while x:", "5:15", "this isn't valid Python."],
        ['$ x = (1,⏎[8]2 +⏎[8])', "7:9", "this isn't valid Python."],
        ["$ break", "5:7", '"break" outside loop.'],
