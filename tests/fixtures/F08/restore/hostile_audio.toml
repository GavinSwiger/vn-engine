# AC-F08-13 (F08 06-acceptance.md §1.2, §5.4): saved `audio` values that GameState.from_json
# refuses (StateInvalid, nothing else, within 1 s, no text holding ZZMARK) or loads.
# Each `json` is the `audio` value of F03's state B (tests/runtime/conftest.state_b_json).
# Generated parts, expanded by tests/runtime/test_state_audio.py after json.loads:
#   "@music:N"  N valid music entries     "@sounds:N"  N valid sound loops, distinct files
#   "@zz:N"     a string of exactly N characters starting "ZZMARK"
# `missing = true` drops the `audio` key instead (a save from before F08).

